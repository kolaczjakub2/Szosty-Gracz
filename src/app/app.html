@let leadVm = leadViewModel();
@let archiveVm = archiveViewModel();

<div class="page-shell">
    <app-site-header
      [logoUrl]="logoUrl"
      [navItems]="navItems"
      [teams]="teams"
      [selectedTeam]="selectedTeam()"
      [activeNavItemKey]="activeNavItemKey()"
      [allFeedSelected]="allFeedSelected()"
      (homeSelected)="goHome()"
      (navItemSelected)="selectNavItem($event)"
      (teamSelected)="selectTeam($event)"
      (filterCleared)="clearTeamFilter()"
    />

  <main class="shell">
    @if (selectedPostId()) {
      <app-article-detail
        [viewModel]="articleDetailViewModel()"
        (closed)="closeArticle()"
        (tagSelected)="selectTag($event)"
        (termSelected)="selectTerm($event)"
      />
    } @else if (leadVm.loading) {
      <section class="loading-state">
        <mat-spinner diameter="44"></mat-spinner>
      </section>
    } @else if (leadVm.error) {
      <section class="error-state">
        <mat-icon>cloud_off</mat-icon>
        <p>{{ leadVm.error }}</p>
      </section>
    } @else if (leadVm.hero; as hero) {
      <app-lead-grid
        [hero]="hero"
        [sideArticles]="leadVm.sideArticles"
        (articleOpened)="openArticle($event)"
      />

      <app-news-ticker
        [label]="tickerLabel()"
        [articles]="leadVm.latest.slice(0, 3)"
        (articleOpened)="openArticle($event)"
      />

      <section id="archive-section" class="content-grid">
        <app-latest-panel
          [title]="archiveTitle()"
          [articles]="visibleLatest()"
          [page]="archiveVm.page"
          [total]="archiveVm.total"
          [totalPages]="archiveVm.totalPages"
          [pages]="archivePages()"
          (articleOpened)="openArticle($event)"
          (pageSelected)="changeArchivePage($event)"
        />
      </section>
    } @else {
      <section class="empty-state">
        <mat-icon>filter_alt_off</mat-icon>
        <p>Brak wpisów dla tego filtra.</p>
        <button matButton type="button" (click)="clearTeamFilter()">Wyczyść filtr</button>
      </section>
    }
  </main>
</div>
