@if (team(); as selectedTeam) {
  <div class="active-filter shell" aria-live="polite">
    <span>
      <app-icon name="filter_alt" />
      {{ selectedTeam.name }}
    </span>
    <button matButton type="button" (click)="filterCleared.emit()">
      Wyczyść
      <app-icon name="close" />
    </button>
  </div>
}
