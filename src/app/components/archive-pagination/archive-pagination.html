@if (totalPages() > 1) {
  <nav class="archive-pagination" aria-label="Paginacja archiwum">
    <button
      type="button"
      [disabled]="page() <= 1"
      aria-label="Poprzednia strona"
      (click)="pageSelected.emit(page() - 1)"
    >
      <app-icon name="chevron_left" />
    </button>

    <div class="archive-pagination__pages">
      @for (item of pages(); track item) {
        <button
          matButton
          type="button"
          class="archive-pagination__page"
          [class.archive-pagination__page--active]="item === page()"
          [attr.aria-current]="item === page() ? 'page' : null"
          (click)="pageSelected.emit(item)"
        >
          {{ item }}
        </button>
      }
    </div>

    <span class="archive-pagination__status">Strona {{ page() }} z {{ totalPages() }}</span>

    <button
      type="button"
      [disabled]="page() >= totalPages()"
      aria-label="Następna strona"
      (click)="pageSelected.emit(page() + 1)"
    >
      <app-icon name="chevron_right" />
    </button>
  </nav>
}
