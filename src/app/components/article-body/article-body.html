<article>
  <header class="article-detail__header">
    @if (article().primaryTerm; as primaryTerm) {
      <button
        type="button"
        class="eyebrow eyebrow--button"
        [attr.aria-label]="'Pokaż wpisy: ' + article().category"
        (click)="termSelected.emit(primaryTerm)"
      >
        {{ article().category }}
      </button>
    } @else {
      <span class="eyebrow">{{ article().category }}</span>
    }
    <h1>{{ article().title }}</h1>
    <div class="article-detail__meta">
      <span>Autor: {{ article().authorName }}</span>
      <span>Data: {{ article().date | date: 'dd.MM.yyyy, HH:mm' }}</span>
    </div>
  </header>
  <div class="article-detail__content" [innerHTML]="article().contentHtml"></div>

  <a
    matButton
    class="article-detail__source"
    [href]="article().link"
    target="_blank"
    rel="noreferrer"
  >
    Otwórz oryginał
    <mat-icon aria-hidden="true">north_east</mat-icon>
  </a>

  <app-article-tags [tags]="article().tags" (tagSelected)="tagSelected.emit($event)" />
</article>
