@let vm = viewModel();

<section class="article-detail">
  <button
    type="button"
    class="article-detail__back"
    aria-label="Wróć do listy"
    (click)="closed.emit()"
  >
    <app-icon name="arrow_back" />
    Wróć do listy
  </button>

  @if (vm.loading) {
    <div class="loading-state article-detail__loading">
      <span class="ui-spinner" role="status" aria-label="Ładowanie"></span>
    </div>
  } @else if (vm.error) {
    <div class="error-state">
      <app-icon name="cloud_off" />
      <p>{{ vm.error }}</p>
    </div>
  } @else if (vm.article; as article) {
    <app-article-body
      [article]="article"
      (tagSelected)="tagSelected.emit($event)"
      (termSelected)="termSelected.emit($event)"
    />

    @defer (hydrate on viewport) {
      <app-article-recommendations
        [relatedArticles]="vm.relatedArticles"
        [authorArticles]="vm.authorArticles"
        [authorName]="article.authorName"
        (articleOpened)="articleOpened.emit($event)"
      />
    }

    @defer (hydrate on viewport) {
      <app-article-comments
        [postId]="article.id"
        [comments]="vm.comments"
        [commentCount]="vm.commentCount"
      />
    }
  }
</section>
