@let vm = viewModel();

<section class="article-detail">
  <button
    matButton
    type="button"
    class="article-detail__back"
    aria-label="Wróć do listy"
    (click)="closed.emit()"
  >
    <mat-icon aria-hidden="true">arrow_back</mat-icon>
    Wróć do listy
  </button>

  @if (vm.loading) {
    <div class="loading-state article-detail__loading">
      <mat-spinner diameter="44"></mat-spinner>
    </div>
  } @else if (vm.error) {
    <div class="error-state">
      <mat-icon>cloud_off</mat-icon>
      <p>{{ vm.error }}</p>
    </div>
  } @else if (vm.article; as article) {
    <app-article-body
      [article]="article"
      (tagSelected)="tagSelected.emit($event)"
      (termSelected)="termSelected.emit($event)"
    />

    <app-article-comments [comments]="vm.comments" [commentCount]="vm.commentCount" />
  }
</section>
