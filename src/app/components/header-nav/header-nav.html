<nav class="category-nav" aria-label="Główna nawigacja">
  @for (item of navItems(); track item.label) {
    <a
      class="category-nav__item"
      [href]="navItemHref(item)"
      [class.category-nav__item--active]="activeNavItemKey() === navItemKey(item)"
      [attr.aria-current]="activeNavItemKey() === navItemKey(item) ? 'page' : null"
      (click)="$event.preventDefault(); navItemSelected.emit(item)"
    >
      {{ item.label }}
    </a>
  }
</nav>
