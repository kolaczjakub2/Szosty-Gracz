<section class="panel archive-panel latest-panel">
  <div class="archive-heading">
    <div>
      <span>Archiwum wpisów</span>
      <h2>{{ title() }}</h2>
    </div>
    <strong>{{ total() }} wpisów</strong>
  </div>

  <div class="archive-grid">
    @for (article of articlesBeforeRandom(); track article.id) {
      <app-archive-card [article]="article" (articleOpened)="articleOpened.emit($event)" />
    }

    @if (showPromos()) {
      <app-home-promos />
    }

    @if (showRandomArchive()) {
      <app-random-archive-section
        [articles]="randomArticles()"
        [loading]="randomLoading()"
        [error]="randomError()"
        (articleOpened)="articleOpened.emit($event)"
        (randomRequested)="randomRequested.emit()"
      />
    }

    @for (article of articlesAfterRandom(); track article.id) {
      <app-archive-card [article]="article" (articleOpened)="articleOpened.emit($event)" />
    }
  </div>

  <app-archive-pagination
    [page]="page()"
    [totalPages]="totalPages()"
    [pages]="pages()"
    (pageSelected)="pageSelected.emit($event)"
  />
</section>
