<div
  class="hero-carousel"
  (mouseenter)="autoplayPaused.emit()"
  (mouseleave)="autoplayResumed.emit()"
  (focusin)="autoplayPaused.emit()"
  (focusout)="autoplayResumed.emit()"
>
  <a
    class="hero-story story-link"
    [href]="articlePath(article())"
    (click)="$event.preventDefault(); articleOpened.emit(article())"
  >
    <img
      class="hero-story__backdrop"
      [src]="optimizedImageUrl(article().heroImageUrl || article().imageUrl, 720, 52)"
      [srcset]="optimizedImageSrcset(article().heroImageUrl || article().imageUrl, [360, 540, 720, 960])"
      sizes="100vw"
      alt=""
      aria-hidden="true"
      loading="lazy"
      fetchpriority="low"
      width="1096"
      height="720"
    />
    <img
      class="hero-story__image"
      [src]="optimizedImageUrl(article().heroImageUrl || article().imageUrl, 720, 68)"
      [srcset]="optimizedImageSrcset(article().heroImageUrl || article().imageUrl, [480, 640, 800, 960])"
      sizes="(max-width: 760px) calc(100vw - 54px), (max-width: 1200px) 70vw, 720px"
      [alt]="article().imageAlt"
      loading="eager"
      fetchpriority="high"
      decoding="sync"
      width="1096"
      height="720"
    />
    <span class="hero-story__scan" aria-hidden="true"></span>
    <span class="hero-story__court" aria-hidden="true"></span>

    <div class="hero-story__frame" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="hero-story__content">
      <div class="hero-story__kicker">
        <span class="eyebrow">{{ article().category }}</span>
        <span class="hero-story__date">
          <app-icon name="schedule" />
          {{ article().date | date: 'dd.MM.yyyy, HH:mm' }}
        </span>
      </div>
      <h1>{{ article().title }}</h1>
      <p>{{ article().excerpt }}</p>
      <div class="hero-story__actions">
        <span class="hero-story__cta">
          Czytaj artykuł
          <app-icon name="arrow_forward" />
        </span>
      </div>
    </div>
  </a>

  <div class="hero-carousel__controls" aria-label="Sterowanie karuzelą">
    <button
      type="button"
      aria-label="Poprzedni artykuł"
      (click)="previousSelected.emit()"
    >
      <app-icon name="chevron_left" />
    </button>
    <span>{{ currentLabel() }} / {{ totalLabel() }}</span>
    <button type="button" aria-label="Następny artykuł" (click)="nextSelected.emit()">
      <app-icon name="chevron_right" />
    </button>
  </div>

  <div class="hero-carousel__progress" aria-hidden="true">
    <span [style.width.%]="progressPercent()"></span>
  </div>
</div>
