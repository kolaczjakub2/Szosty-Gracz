<section class="lead-grid" aria-label="Najważniejsze wpisy">
  <app-lead-carousel
    [article]="activeArticle()"
    [currentLabel]="currentSlideLabel()"
    [totalLabel]="totalSlideLabel()"
    [progressPercent]="progressPercent()"
    (articleOpened)="articleOpened.emit($event)"
    (previousSelected)="previousSlide()"
    (nextSelected)="nextSlide()"
    (autoplayPaused)="pauseAutoplay()"
    (autoplayResumed)="resumeAutoplay()"
  />

  <app-story-deck
    [articles]="featureArticles()"
    [activeIndex]="normalizedIndex()"
    (slideSelected)="openStory($event)"
  />
</section>
