<section class="ticker" aria-label="Szybkie linki">
  <strong>{{ label() }}</strong>
  @for (article of articles(); track article.id) {
    <a
      [href]="article.link"
      target="_blank"
      rel="noreferrer"
      (click)="$event.preventDefault(); articleOpened.emit(article)"
      >{{ article.title }}</a
    >
  }
</section>
