<header class="site-header">
  <app-header-topbar />

  <div class="masthead shell">
    <a
      class="brand"
      href="/"
      aria-label="Szósty Gracz"
      (click)="$event.preventDefault(); homeSelected.emit()"
    >
      <img [src]="logoUrl()" alt="Szósty Gracz" />
    </a>

    <app-header-nav
      [navItems]="navItems()"
      [activeNavItemKey]="activeNavItemKey()"
      (navItemSelected)="navItemSelected.emit($event)"
    />
  </div>

  <app-team-strip
    [teams]="teams()"
    [selectedTeam]="selectedTeam()"
    [allFeedSelected]="allFeedSelected()"
    (teamSelected)="teamSelected.emit($event)"
    (filterCleared)="filterCleared.emit()"
  />

  <app-active-filter [team]="selectedTeam()" (filterCleared)="filterCleared.emit()" />
</header>
